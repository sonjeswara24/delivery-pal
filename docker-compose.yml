services:
  db:
    image: postgis/postgis:16-3.4
    container_name: delivery-pal-db
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
      POSTGRES_DB: deliverypal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  api:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://delivery:delivery@db:5432/deliverypal
    depends_on:
      - db

volumes:
  pgdata: