services:
  db:
    image: postgis/postgis:16-3.4
    container_name: delivery-pal-db
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
      POSTGRES_DB: deliverypal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://delivery:delivery@db:5432/deliverypal
      REDIS_URL: redis://redis:6379
      CACHE_ENABLED: "${CACHE_ENABLED:-true}"
    depends_on:
      - db
      - redis

volumes:
  pgdata: